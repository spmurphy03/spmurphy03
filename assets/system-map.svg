<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Technical focus map</title>
<desc id="desc">Endpoint support connects through networking to cloud services and robotics systems</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="50%" stop-color="#071426"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="250" rx="24" fill="url(#bg)" stroke="#1e293b"/>
<path d="M190 126 H1010" stroke="#0ea5e9" stroke-opacity=".35" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(90 68)">
    <rect width="210" height="116" rx="18" fill="#081321" stroke="#334155"/>
    <text x="24" y="37" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">01 / ENDPOINT</text>
    <text x="24" y="69" fill="#f8fafc" font-size="21" font-weight="700">IT Support</text>
    <text x="24" y="94" fill="#94a3b8" font-size="13">Windows • Hardware • Users</text>
  </g>
  <g transform="translate(345 68)">
    <rect width="210" height="116" rx="18" fill="#081321" stroke="#334155"/>
    <text x="24" y="37" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">02 / NETWORK</text>
    <text x="24" y="69" fill="#f8fafc" font-size="21" font-weight="700">Connectivity</text>
    <text x="24" y="94" fill="#94a3b8" font-size="13">TCP/IP • DNS • DHCP • Fiber</text>
  </g>
  <g transform="translate(600 68)">
    <rect width="210" height="116" rx="18" fill="#081321" stroke="#334155"/>
    <text x="24" y="37" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">03 / CLOUD</text>
    <text x="24" y="69" fill="#f8fafc" font-size="21" font-weight="700">Infrastructure</text>
    <text x="24" y="94" fill="#94a3b8" font-size="13">AWS • Linux • IAM • VMs</text>
  </g>
  <g transform="translate(855 68)">
    <rect width="210" height="116" rx="18" fill="#081321" stroke="#334155"/>
    <text x="24" y="37" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">04 / FIELD</text>
    <text x="24" y="69" fill="#f8fafc" font-size="21" font-weight="700">Robotics</text>
    <text x="24" y="94" fill="#94a3b8" font-size="13">Diagnostics • Deployments • Ops</text>
  </g>
</g>
<g fill="#22d3ee" filter="url(#g)">
  <circle cx="322" cy="126" r="5"/><circle cx="577" cy="126" r="5"/><circle cx="832" cy="126" r="5"/>
</g>
<text x="90" y="42" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">TECHNICAL FOCUS MAP</text>
</svg>